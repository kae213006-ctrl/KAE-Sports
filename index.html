const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,data,tab='Turniere',kind='national',path=[],q='',filter='';const tabs=['Turniere','Mannschaften','Auslosung','Stadien'];const kinds={national:'Nationalmannschaften',club:'Vereinsfußball'};const fresh=()=>({version:1,folders:[],teams:[],stadiums:[],competitions:[]});
async function init(){db=await new Promise((res,rej)=>{let r=indexedDB.open('kae-sports',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});data=await new Promise((res,rej)=>{let r=db.transaction('state').objectStore('state').get('main');r.onsuccess=()=>res(r.result||fresh());r.onerror=()=>rej(r.error)});render()}async function save(){await new Promise((res,rej)=>{let t=db.transaction('state','readwrite');t.objectStore('state').put(data,'main');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});render()}function commit(){save().catch(e=>alert('Speichern fehlgeschlagen: '+e.message))}function switchTab(t){tab=t;path=[];q='';filter='';render()}function setKind(k){kind=k;path=[];q='';filter='';render()}function image(x,icon){return x&&/^data:image\/(png|jpeg|webp|gif);base64,/i.test(x)?`<img src="${esc(x)}" alt="">`:`<span class="placeholder">${icon}</span>`}function row(x,icon,action,collection,sub='',sort=false){return `<div class="line" ${sort?`draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')" ondragover="event.preventDefault()" ondrop="drop(event,'${x.id}')"`:''}>${image(x.image,icon)}<strong onclick="${action}">${esc(x.name)}${sub?`<span class="sub">${esc(sub)}</span>`:''}</strong>${sort?`<button onclick="move('${x.id}',-1)">↑</button><button onclick="move('${x.id}',1)">↓</button>`:''}<button onclick="edit('${collection}','${x.id}')">✎</button></div>`}function kindbar(){return `<div class="toolbar">${Object.entries(kinds).map(([k,v])=>`<button style="font-weight:${kind===k?800:400}" onclick="setKind('${k}')">${v}</button>`).join('')}</div>`}function render(){ $('#nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('');let h='';if(tab==='Turniere'){let parent=path.at(-1)||null;let f=data.folders.filter(x=>x.kind===kind&&x.parent===parent),c=data.competitions.filter(x=>x.kind===kind&&x.parent===parent);h=kindbar()+`<div class="toolbar">${path.length?'<button onclick="path.pop();render()">← Zurück</button>':''}<button onclick="edit('folders')">+ Kategorie</button><button onclick="edit('competitions')">+ Wettbewerb</button></div><h2>${esc(path.length?data.folders.find(x=>x.id===parent)?.name:kinds[kind])}</h2>`+f.map(x=>row(x,'▣',`path.push('${x.id}');render()`,'folders','',true)).join('')+c.map(x=>row(x,'🏆',`competition('${x.id}')`,'competitions')).join('')+(!f.length&&!c.length?'<div class="empty">Noch keine Kategorien oder Wettbewerbe.</div>':'')}else if(tab==='Mannschaften'){let ts=data.teams.filter(x=>x.kind===kind),opts=[...new Set(ts.map(x=>kind==='national'?x.conf:x.country).filter(Boolean))].sort();h=kindbar()+`<div class="toolbar"><input placeholder="Mannschaft suchen" value="${esc(q)}" oninput="q=this.value;teamList()"><button onclick="edit('teams')">+ Team</button><select onchange="filter=this.value;teamList()"><option value="">Alle</option>${opts.map(o=>`<option ${o===filter?'selected':''}>${esc(o)}</option>`).join('')}</select></div><div id="teams"></div>`}else if(tab==='Stadien'){h=`<div class="toolbar"><button onclick="edit('stadiums')">+ Stadion</button></div>`+data.stadiums.map(x=>row(x,'▧',`edit('stadiums','${x.id}')`,'stadiums',[x.city,x.country,x.capacity?Number(x.capacity).toLocaleString('de-DE')+' Plätze':''].filter(Boolean).join(' | '))).join('')+(!data.stadiums.length?'<div class="empty">Noch keine Stadien.</div>':'')}else{h='<h2>Auslosung</h2><div class="empty">Die unabhängige Auslosungsfunktion folgt in einer späteren Version.</div>'}$('#main').innerHTML=h;if(tab==='Mannschaften')teamList()}function teamList(){let a=data.teams.filter(x=>x.kind===kind&&(!filter||(kind==='national'?x.conf:x.country)===filter)&&[x.name,x.code].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'de'));$('#teams').innerHTML=a.map(x=>row(x,'⚑',`profile('${x.id}')`,'teams',[x.code,x.conf,x.country].filter(Boolean).join(' | '))).join('')||'<div class="empty">Keine Mannschaften gefunden.</div>'}function move(id,d){let a=data.folders,i=a.findIndex(x=>x.id===id),x=a[i],siblings=a.filter(y=>y.kind===x.kind&&y.parent===x.parent),j=siblings.indexOf(x)+d;if(j<0||j>=siblings.length)return;let k=a.indexOf(siblings[j]);[a[i],a[k]]=[a[k],a[i]];commit()}function drop(e,id){e.preventDefault();let a=data.folders,i=a.findIndex(x=>x.id===e.dataTransfer.getData('text/plain')),j=a.findIndex(x=>x.id===id);if(i<0||j<0||a[i].parent!==a[j].parent||a[i].kind!==a[j].kind)return;let [x]=a.splice(i,1);a.splice(j,0,x);commit()}
function open(h,full=false){let m=$('#modal');m.classList.toggle('full',full);m.innerHTML=h;if(!m.open)m.showModal()}function closeModal(){$('#modal').close()}function field(n,l,v='',type='text',req=false){return `<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${req?'required':''} ${type==='number'?'min="0" step="1"':''}></label>`}function edit(col,id){let old=data[col].find(x=>x.id===id),x=old||{id:uid(),kind,parent:path.at(-1)||null};let names={folders:'Kategorie',teams:'Mannschaft',stadiums:'Stadion',competitions:'Wettbewerb'};let h=`<h2>${names[col]} ${old?'bearbeiten':'erstellen'}</h2><form id="editform">${field('name','Name',x.name,'text',true)}`;if(col==='teams')h+=field('code','Kürzel',x.code)+`<label>Verband<select name="conf"><option value="">–</option>${['UEFA','CAF','AFC','CONMEBOL','CONCACAF','OFC','Andere'].map(v=>`<option ${x.conf===v?'selected':''}>${v}</option>`).join('')}</select></label>`+(x.kind==='club'?field('country','Herkunftsland',x.country):'')+`<label>Heimstadion<select name="stadium"><option value="">–</option>${data.stadiums.map(s=>`<option value="${s.id}" ${x.stadium===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`;if(col==='stadiums')h+=field('city','Stadt',x.city)+field('country','Land',x.country)+field('capacity','Kapazität',x.capacity,'number');h+=`<label>Bilddatei<input type="file" name="picture" accept="image/png,image/jpeg,image/webp,image/gif"></label>${image(x.image,'▧')}<label><input style="display:inline;width:auto" type="checkbox" name="removeImage"> Bild entfernen</label><div class="toolbar"><button type="submit">Speichern</button><button type="button" onclick="closeModal()">Abbrechen</button>${old?`<button type="button" class="danger" onclick="remove('${col}','${id}')">Löschen</button>`:''}</div></form>`;open(h);$('#editform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('picture'),next={...x};for(let [k,v] of f)if(!['picture','removeImage'].includes(k))next[k]=v.trim();if(!next.name)return;if(f.get('removeImage'))delete next.image;try{if(file?.size){if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw Error('Nicht unterstütztes Bildformat');next.image=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}if(old)data[col][data[col].indexOf(old)]=next;else data[col].push(next);await save();closeModal()}catch(e){alert('Fehler: '+e.message)}}}function remove(col,id){if(col==='competitions'&&data.competitions.find(x=>x.id===id)?.seasons?.length)return alert('Wettbewerb enthält Spielzeiten.');if(col==='folders'&&[...data.folders,...data.competitions].some(x=>x.parent===id))return alert('Bitte zuerst den Inhalt der Kategorie entfernen.');if(col==='stadiums'&&data.teams.some(x=>x.stadium===id))return alert('Dieses Stadion ist einer Mannschaft zugeordnet.');if(confirm('Wirklich löschen?')){data[col]=data[col].filter(x=>x.id!==id);commit();closeModal()}}function profile(id){let x=data.teams.find(t=>t.id===id);open(`<div style="text-align:center">${image(x.image,'⚑')}<h2>${esc(x.name)}</h2>${esc(x.code||'')} · ${esc(x.conf||'')}</div><h2>Gewonnene Titel</h2><p>Noch keine Turnierdaten.</p><h2>Turnierhistorie</h2><p>Noch keine Turnierdaten.</p><button onclick="edit('teams','${id}')">Bearbeiten</button> <button onclick="closeModal()">Zurück</button>`)}function seasons(c){return c.seasons||(c.seasons=[])}
function compHeader(c,back){return `<div class="comphead"><button onclick="${back}">‹</button>${image(c.image,'🏆')}<strong>${esc(c.name)}</strong></div>`}function competition(id){let c=data.competitions.find(x=>x.id===id);open(compHeader(c,'closeModal()')+`<div class="toolbar"><button onclick="newSeason('${id}')">＋ Neue Saison erstellen</button></div>`+seasons(c).slice().reverse().map(s=>`<div class="line"><strong onclick="seasonView('${id}','${s.id}',undefined,'Tabelle',1)">${esc(s.name)}<small class="sub">${s.locked?'Archiv':s.done?'Beendet':'Aktiv'}</small></strong></div>`).join(''),true)}
function newSeason(id){let c=data.competitions.find(x=>x.id===id);if(seasons(c).some(s=>!s.done))return alert('Bitte zuerst die laufende Saison beenden.');open(`<h2>Neue Saison</h2><form id="sf">${field('name','Saison / Jahr','','text',true)}<label>Modus<select name="mode"><option value="league">Liga</option><option value="groups">Gruppenphase</option><option value="ko">K.-o.</option></select></label><label>Spiele pro Paarung<select name="legs"><option value="2">Hin- und Rückspiel</option><option value="1">Ein Spiel</option></select></label>${field('groups','Gruppenanzahl (nur Gruppenphase)',2,'number')}${field('advance','Weiter pro Gruppe (nur Gruppenphase)',2,'number')}${field('up','Aufstiegsplätze',0,'number')}${field('down','Abstiegsplätze',0,'number')}${field('international','Internationale Plätze',0,'number')}<h3>Mannschaften auswählen</h3><input placeholder="Suchen" oninput="document.querySelectorAll('.pick').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(this.value.toLowerCase()))">${data.teams.filter(t=>t.kind===c.kind).sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<label class="pick"><input style="display:inline;width:auto" type="checkbox" name="team" value="${t.id}"> ${esc(t.name)}</label>`).join('')}<button type="submit">Saison starten</button> <button type="button" onclick="competition('${id}')">Zurück</button></form>`);$('#sf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),ids=f.getAll('team'),mode=f.get('mode'),g=+f.get('groups'),a=+f.get('advance'),legs=+f.get('legs');if(ids.length<2)return alert('Mindestens zwei Teams auswählen.');if(mode==='ko'&&!power(ids.length))return alert('K.-o. benötigt 2, 4, 8, 16 ... Teams.');if(mode==='groups'&&(g<2||ids.length%g||a<1||a>ids.length/g||!power(g*a)))return alert('Gleich große Gruppen und eine K.-o.-Teilnehmerzahl von 2, 4, 8, 16 ... erforderlich.');let name=f.get('name').trim();if(!name||seasons(c).some(s=>s.name===name))return alert('Bitte einen neuen Saisonnamen eingeben.');let s={id:uid(),name,mode,legs,advance:a,up:+f.get('up'),down:+f.get('down'),international:+f.get('international'),teams:data.teams.filter(t=>ids.includes(t.id)).map(t=>({...t})),phases:[]};if(mode==='ko')s.phases.push(knock(ids,legs));else {let groups=Array.from({length:mode==='league'?1:g},()=>[]);ids.forEach((t,i)=>groups[i%groups.length].push(t));s.phases.push({type:'table',groups,matches:groups.flatMap((ts,i)=>roundRobin(ts,legs,i))})}seasons(c).forEach(x=>x.locked=true);seasons(c).push(s);commit();seasonView(id,s.id,undefined,'Tabelle',1)}}
function power(n){return n>=2&&(n&(n-1))===0}function match(h,a,day,group=0){return {id:uid(),h,a,day,group,x:null,y:null}}
function roundRobin(ids,legs,group){let t=ids.slice(),m=[];if(t.length%2)t.push(null);let n=t.length;for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){let h=t[i],a=t[n-1-i];if(h&&a){if((r+i)%2)[h,a]=[a,h];m.push(match(h,a,r+1,group));if(legs===2)m.push(match(a,h,r+n,group))}}t.splice(1,0,t.pop())}return m}
function knock(ids,legs){let ties=[];for(let i=0;i<ids.length;i+=2){let h=ids[i],a=ids[i+1];ties.push({h,a,matches:[match(h,a,1),...(legs===2?[match(a,h,2)]:[])]})}return {type:'ko',ties}}
function standings(s,p,i){let rows=p.groups[i].map(id=>({id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));for(let m of p.matches.filter(m=>m.group===i&&m.x!==null)){let h=rows.find(r=>r.id===m.h),a=rows.find(r=>r.id===m.a);h.p++;a.p++;h.gf+=m.x;h.ga+=m.y;a.gf+=m.y;a.ga+=m.x;if(m.x===m.y){h.d++;a.d++;h.pts++;a.pts++}else{let w=m.x>m.y?h:a,l=w===h?a:h;w.w++;l.l++;w.pts+=3}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||teamName(s,a.id).localeCompare(teamName(s,b.id)))}
function teamName(s,id){return s.teams.find(t=>t.id===id)?.name||'?' }function teamMark(s,id){let t=s.teams.find(t=>t.id===id);return `<span class="tm">${image(t?.image,'⚑')} ${esc(teamName(s,id))}</span>`}function getSeason(c,s){return seasons(data.competitions.find(x=>x.id===c)).find(x=>x.id===s)}
function winner(t){if(t.matches.some(m=>m.x===null))return null;let x=0,y=0;for(let m of t.matches){if(m.h===t.h){x+=m.x;y+=m.y}else{x+=m.y;y+=m.x}}if(x!==y)return x>y?t.h:t.a;return t.extra&&t.extra[0]!==t.extra[1]?t.extra[0]>t.extra[1]?t.h:t.a:t.pen&&t.pen[0]!==t.pen[1]?t.pen[0]>t.pen[1]?t.h:t.a:null}
let viewTab='Tabelle',viewDay=1;
const markerPresets=[['Champions League','#0000dd'],['Champions League Qualifikation','#6495ed'],['Europa League','#f28c00'],['Europa League Qualifikation','#ffcc80'],['Conference League','#009b16'],['Conference League Qualifikation','#90cf85'],['Aufstieg','#0000dd'],['Aufstiegsplayoffs','#6495ed'],['Weiterkommen','#0000dd'],['Weiterkommen über Playoffs','#6495ed'],['Abstiegsrelegation','#ff9999'],['Abstieg','#e00000'],['Ausscheiden','#e00000']];
function markers(s,p){if(Array.isArray(s.markers))return s.markers;let n=p.groups[0].length,a=[];if(s.mode==='groups'&&s.advance)a.push({name:'Weiterkommen',color:'#0000dd',from:1,to:s.advance});if(s.mode==='league'){if(s.international)a.push({name:'International',color:'#0000dd',from:1,to:s.international});if(s.up)a.push({name:'Aufstieg',color:'#0000dd',from:1,to:s.up});if(s.down)a.push({name:'Abstieg',color:'#e00000',from:Math.max(1,n-s.down+1),to:n})}return a}
function markerRow(m={name:'',color:'#0000dd',from:1,to:1}){return `<div class="markerrow"><input type="color" aria-label="Farbe" value="${esc(m.color)}"><input aria-label="Name" placeholder="Name" value="${esc(m.name)}" required><input type="number" aria-label="Von Platz" min="1" value="${m.from}" required><input type="number" aria-label="Bis Platz" min="1" value="${m.to}" required><button type="button" onclick="this.parentElement.remove()">✕</button></div>`}
function addMarker(){let v=$('#preset').value,m=markerPresets[+v];$('#markerlist').insertAdjacentHTML('beforeend',markerRow(v!==''&&m?{name:m[0],color:m[1],from:1,to:1}:undefined))}
function editMarkers(c,id,pi){let s=getSeason(c,id),p=s.phases[pi];if(s.done||s.locked||pi!==s.phases.length-1)return;open(`<h2>Tabellenmarkierungen</h2><form id="mf"><p>Farbe · Name · Von · Bis</p><div id="markerlist">${markers(s,p).map(markerRow).join('')}</div><select id="preset"><option value="">Eigene Markierung</option>${markerPresets.map((m,i)=>`<option value="${i}">${esc(m[0])}</option>`).join('')}</select><button type="button" onclick="addMarker()">＋ Hinzufügen</button><p><button>Speichern</button> <button type="button" onclick="seasonView('${c}','${id}',${pi})">Abbrechen</button></p></form>`);$('#mf').onsubmit=e=>{e.preventDefault();let a=[...document.querySelectorAll('.markerrow')].map(r=>{let [color,name,from,to]=r.querySelectorAll('input');return {color:color.value,name:name.value.trim(),from:+from.value,to:+to.value}});if(a.some(m=>!m.name||m.from>m.to||m.to>Math.min(...p.groups.map(g=>g.length))))return alert('Bitte gültige Plätze und Namen eingeben.');if(a.some((m,i)=>a.slice(i+1).some(n=>m.from<=n.to&&n.from<=m.to)))return alert('Markierungen dürfen sich nicht überschneiden.');s.markers=a;commit();seasonView(c,id,pi)}}
function seasonView(c,id,pi,vt,day){let s=getSeason(c,id),comp=data.competitions.find(x=>x.id===c);pi=pi??s.phases.length-1;let p=s.phases[pi],ro=s.locked||s.done||pi<s.phases.length-1;viewTab=vt??viewTab;viewDay=day??viewDay;if(p.type==='ko'&&viewTab==='Tabelle')viewTab='Spielplan';let h=compHeader(comp,`competition('${c}')`)+`<div class="panelpad"><strong>${esc(s.name)}</strong> ${s.locked?'Archiv':s.done?'Beendet':''}</div>`;if(s.phases.length>1)h+=`<div class="toolbar">${s.phases.map((v,i)=>`<button onclick="seasonView('${c}','${id}',${i},'${v.type==='table'?'Tabelle':'Spielplan'}',1)">${v.type==='table'?'Gruppenphase':'K.-o. '+(i+1)}</button>`).join('')}</div>`;h+=`<div class="ctabs">${(p.type==='table'?['Tabelle','Spielplan','Mannschaften']:['Spielplan','Mannschaften']).map(v=>`<button class="${viewTab===v?'active':''}" onclick="seasonView('${c}','${id}',${pi},'${v}')">${v}</button>`).join('')}</div>`;let renderMatch=m=>`<div class="fixture">${teamMark(s,m.h)}<button ${ro?'disabled':''} onclick="score('${c}','${id}',${pi},'${m.id}')">${m.x===null?'– : –':m.x+' : '+m.y}</button>${teamMark(s,m.a)}</div>`;if(viewTab==='Mannschaften'){h+=s.teams.slice().sort((a,b)=>a.name.localeCompare(b.name,'de')).map(t=>`<div class="line">${image(t.image,'⚑')}<strong>${esc(t.name)}</strong></div>`).join('')}else if(viewTab==='Tabelle'&&p.type==='table'){let ms=markers(s,p);p.groups.forEach((g,i)=>{if(s.mode!=='league')h+=`<h2>Gruppe ${i+1}</h2>`;h+=`<table class="ranktable"><colgroup><col style="width:12%"><col><col style="width:12%"><col style="width:16%"><col style="width:13%"></colgroup><tr><th>Platz</th><th>Team</th><th>Sp.</th><th>Tore</th><th>Pkt.</th></tr>${standings(s,p,i).map((r,j)=>{let m=ms.find(m=>j+1>=m.from&&j+1<=m.to);return `<tr><td style="border-left-color:${m&&/^#[0-9a-f]{6}$/i.test(m.color)?m.color:'transparent'}">${j+1}</td><td>${teamMark(s,r.id)}</td><td>${r.p}</td><td>${r.gf}:${r.ga}</td><td><strong>${r.pts}</strong></td></tr>`}).join('')}</table>`});h+=`<div class="legend">${ms.map(m=>`<span><i class="swatch" style="background:${/^#[0-9a-f]{6}$/i.test(m.color)?m.color:'#888'}"></i>${esc(m.name)}</span>`).join('')}</div>`;if(!ro)h+=`<div class="toolbar"><button onclick="editMarkers('${c}','${id}',${pi})">Tabellenmarkierungen bearbeiten</button></div>`}else if(p.type==='table'){let days=[...new Set(p.matches.map(m=>m.day))].sort((a,b)=>a-b);if(!days.includes(viewDay))viewDay=days[0];let j=days.indexOf(viewDay);h+=`<div class="matchday"><button ${j===0?'disabled':''} onclick="seasonView('${c}','${id}',${pi},'Spielplan',${days[j-1]??viewDay})">❮</button><strong>${viewDay}. Spieltag</strong><button ${j===days.length-1?'disabled':''} onclick="seasonView('${c}','${id}',${pi},'Spielplan',${days[j+1]??viewDay})">❯</button></div>`;p.groups.forEach((g,i)=>{if(p.groups.length>1)h+=`<h2>Gruppe ${i+1}</h2>`;h+=p.matches.filter(m=>m.day===viewDay&&m.group===i).map(renderMatch).join('')})}else{h+=p.ties.map((t,i)=>`<h2>Duell ${i+1}</h2>${t.matches.map(renderMatch).join('')}${winner(t)?'<p class="panelpad">Weiter: '+esc(teamName(s,winner(t)))+'</p>':t.matches.every(m=>m.x!==null)&&!ro?`<button onclick="decide('${c}','${id}',${pi},${i})">Verlängerung / Elfmeterschießen</button>`:''}`).join('')}if(!ro)h+=`<div class="toolbar"><button onclick="advanceSeason('${c}','${id}')">${p.type==='table'&&s.mode==='league'||p.type==='ko'&&p.ties.length===1?'Saison beenden':'Nächste Runde starten'}</button></div>`;if(s.champion)h+=`<h2>🏆 ${esc(teamName(s,s.champion))}</h2>`;open(h,true)}
function score(c,id,pi,mid){let s=getSeason(c,id),p=s.phases[pi];if(s.done||s.locked||pi!==s.phases.length-1)return;let t=p.ties?.find(t=>t.matches.some(m=>m.id===mid)),m=(t?t.matches:p.matches).find(m=>m.id===mid);open(`<h2>Ergebnis</h2><form id="scoreform">${field('x',teamName(s,m.h),m.x??'','number',true)}${field('y',teamName(s,m.a),m.y??'','number',true)}<button>Speichern</button> <button type="button" onclick="seasonView('${c}','${id}',${pi})">Zurück</button></form>`);$('#scoreform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);m.x=+f.get('x');m.y=+f.get('y');if(t){delete t.extra;delete t.pen}commit();seasonView(c,id,pi)}}
function decide(c,id,pi,i){let s=getSeason(c,id),t=s.phases[pi].ties[i];if(s.done||s.locked||pi!==s.phases.length-1||winner(t)||t.matches.some(m=>m.x===null))return;open(`<h2>Entscheidung</h2><form id="dec"><p>Zusätzliche Tore in der Verlängerung (Reihenfolge: ${esc(teamName(s,t.h))} / ${esc(teamName(s,t.a))})</p>${field('x','Team 1',0,'number',true)}${field('y','Team 2',0,'number',true)}<p>Elfmeterschießen (nur bei gleicher Verlängerung)</p>${field('a','Team 1','','number')}${field('b','Team 2','','number')}<button>Speichern</button></form>`);$('#dec').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x=+f.get('x'),y=+f.get('y'),a=f.get('a'),b=f.get('b');if(x===y&&(!a||!b||+a===+b))return alert('Bitte eindeutiges Elfmeterschießen eintragen.');t.extra=[x,y];t.pen=x===y?[+a,+b]:null;commit();seasonView(c,id,pi)}}
function advanceSeason(c,id){let s=getSeason(c,id),p=s.phases.at(-1);if(s.done||s.locked)return;let ids;if(p.type==='table'){if(p.matches.some(m=>m.x===null))return alert('Bitte alle Ergebnisse eintragen.');ids=p.groups.flatMap((g,i)=>standings(s,p,i).slice(0,s.mode==='league'?1:s.advance).map(r=>r.id))}else{ids=p.ties.map(winner);if(ids.some(x=>!x))return alert('Bitte alle Duelle entscheiden.')}if(!confirm(ids.length===1?'Saison wirklich beenden?':'Nächste Runde starten? Vorherige Ergebnisse werden gesperrt.'))return;if(ids.length===1){s.champion=ids[0];s.done=true}else s.phases.push(knock(ids,s.legs));commit();seasonView(c,id)}
function settings(){open('<h2>Datensicherung</h2><p>Die Daten liegen lokal auf diesem Gerät. Sichere sie regelmäßig.</p><button onclick="exportData()">Exportieren</button><label>Importieren (ersetzt alle Daten)<input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label><button onclick="closeModal()">Schließen</button>')}function exportData(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.href=url;a.download='KAE-Sports-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let n=JSON.parse(await file.text());if(n.version!==1||!['folders','teams','stadiums','competitions'].every(k=>Array.isArray(n[k])&&n[k].every(x=>x&&typeof x.name==='string'&&/^[a-f0-9-]{36}$/.test(x.id))))throw Error('Ungültige Sicherung');if(!confirm('Alle aktuellen Daten durch die Sicherung ersetzen?'))return;data=n;path=[];q='';filter='';await save();closeModal()}catch(e){alert('Import fehlgeschlagen: '+e.message)}}init().catch(e=>{$('#main').textContent='Datenbank konnte nicht geöffnet werden: '+e.message});</script></body></html>
