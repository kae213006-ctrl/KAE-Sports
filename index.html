<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KAE Sports"><title>KAE Sports</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{text-align:center;padding:26px 12px 20px;padding-top:max(26px,env(safe-area-inset-top));font-size:32px;font-weight:900;font-style:italic}header span{color:#888}nav{display:flex;border-block:2px solid #bbb;position:sticky;top:0;background:white;z-index:2}button,input,select{font:inherit}button{background:white;color:#111;border:1px solid #bbb;padding:10px;cursor:pointer;border-radius:5px}nav button{flex:1;border:0;border-radius:0;padding:14px 3px;font-size:clamp(12px,3.5vw,16px)}nav .active{font-weight:800;border-bottom:3px solid #777}main{max-width:850px;margin:auto}.line{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:2px solid #bbb;min-height:60px}.line strong{flex:1;overflow-wrap:anywhere}.line img{width:48px;height:34px;object-fit:contain}.line button{padding:7px;color:#666}.toolbar{display:flex;gap:8px;padding:12px;flex-wrap:wrap}.toolbar input{flex:1;min-width:100px}input,select{padding:10px;border:1px solid #bbb;border-radius:4px;max-width:100%;background:white;color:#111}h2{font-size:20px;margin:14px}small{color:#777}dialog{border:2px solid #bbb;border-radius:12px;width:min(94%,480px);max-height:85vh;overflow:auto}dialog::backdrop{background:#0006}label{display:block;margin:12px 0}label input,label select{display:block;width:100%;margin-top:5px}footer{padding:20px;text-align:center;color:#777} .placeholder{width:48px;text-align:center;color:#888;font-size:25px}.sub{display:block;font-size:12px;color:#777;font-weight:400}.empty{padding:24px;color:#777;text-align:center}.danger{color:#a22} .drag{touch-action:none;cursor:grab} </style></head><body><header>KAE <span>SPORTS</span></header><nav id="nav"></nav><main id="main"></main><footer><button onclick="settings()">⚙ Einstellungen</button> · Version 0.1</footer><dialog id="modal"></dialog><script>
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,data,tab='Turniere',kind='national',path=[],q='',filter='';const tabs=['Turniere','Mannschaften','Auslosung','Stadien'];const kinds={national:'Nationalmannschaften',club:'Vereinsfußball'};const fresh=()=>({version:1,folders:[],teams:[],stadiums:[],competitions:[]});
async function init(){db=await new Promise((res,rej)=>{let r=indexedDB.open('kae-sports',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});data=await new Promise((res,rej)=>{let r=db.transaction('state').objectStore('state').get('main');r.onsuccess=()=>res(r.result||fresh());r.onerror=()=>rej(r.error)});render()}async function save(){await new Promise((res,rej)=>{let t=db.transaction('state','readwrite');t.objectStore('state').put(data,'main');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});render()}function commit(){save().catch(e=>alert('Speichern fehlgeschlagen: '+e.message))}function switchTab(t){tab=t;path=[];q='';filter='';render()}function setKind(k){kind=k;path=[];q='';filter='';render()}function image(x,icon){return x&&/^data:image\/(png|jpeg|webp|gif);base64,/i.test(x)?`<img src="${esc(x)}" alt="">`:`<span class="placeholder">${icon}</span>`}function row(x,icon,action,collection,sub='',sort=false){return `<div class="line" ${sort?`draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')" ondragover="event.preventDefault()" ondrop="drop(event,'${x.id}')"`:''}>${image(x.image,icon)}<strong onclick="${action}">${esc(x.name)}${sub?`<span class="sub">${esc(sub)}</span>`:''}</strong>${sort?`<button onclick="move('${x.id}',-1)">↑</button><button onclick="move('${x.id}',1)">↓</button>`:''}<button onclick="edit('${collection}','${x.id}')">✎</button></div>`}function kindbar(){return `<div class="toolbar">${Object.entries(kinds).map(([k,v])=>`<button style="font-weight:${kind===k?800:400}" onclick="setKind('${k}')">${v}</button>`).join('')}</div>`}function render(){ $('#nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('');let h='';if(tab==='Turniere'){let parent=path.at(-1)||null;let f=data.folders.filter(x=>x.kind===kind&&x.parent===parent),c=data.competitions.filter(x=>x.kind===kind&&x.parent===parent);h=kindbar()+`<div class="toolbar">${path.length?'<button onclick="path.pop();render()">← Zurück</button>':''}<button onclick="edit('folders')">+ Kategorie</button><button onclick="edit('competitions')">+ Wettbewerb</button></div><h2>${esc(path.length?data.folders.find(x=>x.id===parent)?.name:kinds[kind])}</h2>`+f.map(x=>row(x,'▣',`path.push('${x.id}');render()`,'folders','',true)).join('')+c.map(x=>row(x,'🏆',`competition('${x.id}')`,'competitions')).join('')+(!f.length&&!c.length?'<div class="empty">Noch keine Kategorien oder Wettbewerbe.</div>':'')}else if(tab==='Mannschaften'){let ts=data.teams.filter(x=>x.kind===kind),opts=[...new Set(ts.map(x=>kind==='national'?x.conf:x.country).filter(Boolean))].sort();h=kindbar()+`<div class="toolbar"><input placeholder="Mannschaft suchen" value="${esc(q)}" oninput="q=this.value;teamList()"><button onclick="edit('teams')">+ Team</button><select onchange="filter=this.value;teamList()"><option value="">Alle</option>${opts.map(o=>`<option ${o===filter?'selected':''}>${esc(o)}</option>`).join('')}</select></div><div id="teams"></div>`}else if(tab==='Stadien'){h=`<div class="toolbar"><button onclick="edit('stadiums')">+ Stadion</button></div>`+data.stadiums.map(x=>row(x,'▧',`edit('stadiums','${x.id}')`,'stadiums',[x.city,x.country,x.capacity?Number(x.capacity).toLocaleString('de-DE')+' Plätze':''].filter(Boolean).join(' | '))).join('')+(!data.stadiums.length?'<div class="empty">Noch keine Stadien.</div>':'')}else{h='<h2>Auslosung</h2><div class="empty">Die unabhängige Auslosungsfunktion folgt in einer späteren Version.</div>'}$('#main').innerHTML=h;if(tab==='Mannschaften')teamList()}function teamList(){let a=data.teams.filter(x=>x.kind===kind&&(!filter||(kind==='national'?x.conf:x.country)===filter)&&[x.name,x.code].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'de'));$('#teams').innerHTML=a.map(x=>row(x,'⚑',`profile('${x.id}')`,'teams',[x.code,x.conf,x.country].filter(Boolean).join(' | '))).join('')||'<div class="empty">Keine Mannschaften gefunden.</div>'}function move(id,d){let a=data.folders,i=a.findIndex(x=>x.id===id),x=a[i],siblings=a.filter(y=>y.kind===x.kind&&y.parent===x.parent),j=siblings.indexOf(x)+d;if(j<0||j>=siblings.length)return;let k=a.indexOf(siblings[j]);[a[i],a[k]]=[a[k],a[i]];commit()}function drop(e,id){e.preventDefault();let a=data.folders,i=a.findIndex(x=>x.id===e.dataTransfer.getData('text/plain')),j=a.findIndex(x=>x.id===id);if(i<0||j<0||a[i].parent!==a[j].parent||a[i].kind!==a[j].kind)return;let [x]=a.splice(i,1);a.splice(j,0,x);commit()}
function open(h){let m=$('#modal');m.innerHTML=h;if(!m.open)m.showModal()}function closeModal(){$('#modal').close()}function field(n,l,v='',type='text',req=false){return `<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${req?'required':''} ${type==='number'?'min="0" step="1"':''}></label>`}function edit(col,id){let old=data[col].find(x=>x.id===id),x=old||{id:uid(),kind,parent:path.at(-1)||null};let names={folders:'Kategorie',teams:'Mannschaft',stadiums:'Stadion',competitions:'Wettbewerb'};let h=`<h2>${names[col]} ${old?'bearbeiten':'erstellen'}</h2><form id="editform">${field('name','Name',x.name,'text',true)}`;if(col==='teams')h+=field('code','Kürzel',x.code)+`<label>Verband<select name="conf"><option value="">–</option>${['UEFA','CAF','AFC','CONMEBOL','CONCACAF','OFC','Andere'].map(v=>`<option ${x.conf===v?'selected':''}>${v}</option>`).join('')}</select></label>`+(x.kind==='club'?field('country','Herkunftsland',x.country):'')+`<label>Heimstadion<select name="stadium"><option value="">–</option>${data.stadiums.map(s=>`<option value="${s.id}" ${x.stadium===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`;if(col==='stadiums')h+=field('city','Stadt',x.city)+field('country','Land',x.country)+field('capacity','Kapazität',x.capacity,'number');h+=`<label>Bilddatei<input type="file" name="picture" accept="image/png,image/jpeg,image/webp,image/gif"></label>${image(x.image,'▧')}<label><input style="display:inline;width:auto" type="checkbox" name="removeImage"> Bild entfernen</label><div class="toolbar"><button type="submit">Speichern</button><button type="button" onclick="closeModal()">Abbrechen</button>${old?`<button type="button" class="danger" onclick="remove('${col}','${id}')">Löschen</button>`:''}</div></form>`;open(h);$('#editform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('picture'),next={...x};for(let [k,v] of f)if(!['picture','removeImage'].includes(k))next[k]=v.trim();if(!next.name)return;if(f.get('removeImage'))delete next.image;try{if(file?.size){if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw Error('Nicht unterstütztes Bildformat');next.image=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}if(old)data[col][data[col].indexOf(old)]=next;else data[col].push(next);await save();closeModal()}catch(e){alert('Fehler: '+e.message)}}}function remove(col,id){if(col==='folders'&&[...data.folders,...data.competitions].some(x=>x.parent===id))return alert('Bitte zuerst den Inhalt der Kategorie entfernen.');if(col==='stadiums'&&data.teams.some(x=>x.stadium===id))return alert('Dieses Stadion ist einer Mannschaft zugeordnet.');if(confirm('Wirklich löschen?')){data[col]=data[col].filter(x=>x.id!==id);commit();closeModal()}}function profile(id){let x=data.teams.find(t=>t.id===id);open(`<div style="text-align:center">${image(x.image,'⚑')}<h2>${esc(x.name)}</h2>${esc(x.code||'')} · ${esc(x.conf||'')}</div><h2>Gewonnene Titel</h2><p>Noch keine Turnierdaten.</p><h2>Turnierhistorie</h2><p>Noch keine Turnierdaten.</p><button onclick="edit('teams','${id}')">Bearbeiten</button> <button onclick="closeModal()">Zurück</button>`)}function competition(id){let x=data.competitions.find(t=>t.id===id);open(`<h2>${esc(x.name)}</h2>${image(x.image,'🏆')}<p>Austragungen und Turnierdesigner folgen im nächsten Entwicklungsschritt.</p><button onclick="closeModal()">Zurück</button>`)}function settings(){open('<h2>Datensicherung</h2><p>Die Daten liegen lokal auf diesem Gerät. Sichere sie regelmäßig.</p><button onclick="exportData()">Exportieren</button><label>Importieren (ersetzt alle Daten)<input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label><button onclick="closeModal()">Schließen</button>')}function exportData(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.href=url;a.download='KAE-Sports-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let n=JSON.parse(await file.text());if(n.version!==1||!['folders','teams','stadiums','competitions'].every(k=>Array.isArray(n[k])&&n[k].every(x=>x&&typeof x.name==='string'&&/^[a-f0-9-]{36}$/.test(x.id))))throw Error('Ungültige Sicherung');if(!confirm('Alle aktuellen Daten durch die Sicherung ersetzen?'))return;data=n;path=[];q='';filter='';await save();closeModal()}catch(e){alert('Import fehlgeschlagen: '+e.message)}}init().catch(e=>{$('#main').textContent='Datenbank konnte nicht geöffnet werden: '+e.message});</script></body></html>
